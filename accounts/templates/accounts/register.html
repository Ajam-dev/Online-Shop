{% extends "base.html" %}

{% block title %}
    ثبت نام | فروشگاه آنلاین
{% endblock %}

{% block content %}
    <header>
        <h1>فروشگاه آنلاین</h1>
    </header>

    <main>
        <h2>ایجاد حساب کاربری</h2>

        <form action="" method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                ثبت نام
            </button>
        </form>

        <p>
            قبلا ثبت نام کرده اید؟
            <a href="{% url 'accounts:login' %}">ورود به حساب کاربری</a>
        </p>
    </main>
{% endblock %}
