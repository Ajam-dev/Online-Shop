{% extends "base.html" %}

{% block title %}
    تایید ایمیل | فروشگاه آنلاین
{% endblock %}

{% block content %}
    <h2>تایید ایمیل</h2>

    <p>
        کد شش رقمی ارسال شده به ایمیل خود را وارد کنید
    </p>

    <form method="post">
        {% csrf_token %}

        {{form.as_p}}

        <button type="submit">تایید ایمیل</button>
    </form>

    <hr>

    <h3>دریافت مجدد کد</h3>
    <form method="POST" action="{% url 'accounts:resend_verification_otp' %}">
        {% csrf_token %}

        <button type="submit">
            ارسال مجدد کد
        </button>
    </form>
    
{% endblock %}
