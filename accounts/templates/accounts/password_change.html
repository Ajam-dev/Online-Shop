<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر گذرواژه | Online Shop</title>
</head>
<body>
    <header>
        <h1>فروشگاه آنلاین</h1>
    </header>

    <main>
        <h2>تغییر گذرواژه</h2>

        {% if messages %}
            {% for message in messages %}
                <p>{{message}}</p>
            {% endfor %}
        {% endif %}

        <form action="" method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">تغییر گذرواژه</button>
        </form>

        <p>
            <a href="{% url 'products:product_list' %}">
                بازگشت به فروشگاه
            </a>
        </p>
    </main>
    
</body>
</html>
