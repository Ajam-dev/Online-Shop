<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی گذرواژه | Online Shope</title>
</head>
<body>
    <header>
        <h1>فروشگاه آنلاین</h1>
    </header>

    <main>
        <h2>بازیابی گذرواژه</h2>
    
        <p>
            نام کاربری خود را وارد کنید تا لینک بازیابی گذرواژه
            به ایمیل ثبت شده در حساب شما ارسال شود.
        </p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">ارسال لینک بازیابی</button>
        </form>

        <p>
            <a href="{% url 'accounts:login' %}">بازگشت به صفحه ورود</a>
        </p>
    </main>


</body>
</html>
