{% extends "base.html" %}

{% block title %}تغییر ایمیل | فروشگاه آنلاین{% endblock %}

{% block content %}

<h2>تغییر ایمیل حساب کاربری</h2>

<p>
    ایمیل جدید خود را وارد کنید
    یک کد شش رقمی برای تایید به این آدرس ارسال خواهد شد
</p>

<form method="POST">
    {% csrf_token %}

    {{form.as_p}}

    <button type="submit">ارسال کد تایید</button>
</form>

<a href="{% url 'accounts:profile' %}">بازگشت به پروفایل</a>

{% endblock %}
