{% extends "base.html" %}

{% block title %}
    ورود | فروشگاه آنلاین
{% endblock %}

{% block content %}
    <header>
        <h1>فروشگاه آنلاین</h1>
    </header>
    <main>
        <h2>ورود به حساب کاربری</h2>
        {% if messages %}
            {% for message in messages %}
                <p>
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}
        <form action="" method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                ورود    
            </button>
        </form>
        <p>
            <a href="{% url 'accounts:password_reset' %}"> فراموشی رمز عبور </a>
        </p>
    </main>
{% endblock %}
