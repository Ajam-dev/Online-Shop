<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | Online Shop</title>
</head>
<body>
    <header>
        <h1>فروشگاه آنلاین</h1>
    </header>
    <main>
        <h2>ورود به حساب کاربری</h2>
        {% if messages %}
            {% for message in messages %}
                <p>
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}
        <form action="" method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                ورود    
            </button>
        </form>
    </main>
</body>
</html>
