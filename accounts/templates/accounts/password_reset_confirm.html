<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعیین گذرواژه جدید | Online Shop</title>
</head>
<body>
    <header>
        <h1>فروشگاه آنلاین</h1>
    </header>

    <main>
        {% if validlink %}
            <h2>تعیین گذرواژه جدید</h2>
            <p>
                لطفا گذرواژه خود را وارد و تایید کنید
            </p>

            <form method="POST">
                {% csrf_token %}
                {{form.as_p}}

                <button type="submit">ثبت گذرواژه جدید</button>
            </form>

        {% else %}
            <h2>لینک نامعتبر است</h2>

            <p>
                این لینک بازیابی نامعتبر یا منقضی شده است.
                لطفا دوباره درخواست بازیابی گذرواژه بدهید. 
            </p>

            <a href="{% url 'accounts:password_reset' %}">
                درخواست لینک جدید
            </a>
        {% endif %}
    </main>
</body>
</html>
